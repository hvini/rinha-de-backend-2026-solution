services:
  api1:
    image: vhpcavalcanti/rinha-backend-2026-api:0.0.1
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "80MB"

  api2:
    image: vhpcavalcanti/rinha-backend-2026-api:0.0.1
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "80MB"

  lb:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "190MB"

networks:
  rinha-network:
    driver: bridge
